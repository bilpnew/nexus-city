
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus City: AI Overdrive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020202;
      color: #ffffff;
      margin: 0;
      overflow: hidden;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    .glass {
      background: rgba(10, 10, 10, 0.7);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .crt::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 99;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
      opacity: 0.4;
    }

    .crt::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
      z-index: 100;
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    
    .bg-grid {
      background-size: 60px 60px;
      background-image: linear-gradient(to right, rgba(255,255,255,0.01) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.01) 1px, transparent 1px);
    }

    @keyframes pulse-cyan {
      0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.1); }
      50% { box-shadow: 0 0 40px rgba(6, 182, 212, 0.3); }
    }

    .animate-pulse-cyan {
      animation: pulse-cyan 3s infinite ease-in-out;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
<body class="bg-grid">
  <div id="root"></div>
</body>
</html>
